services:
  # ============================================================
  # PostgreSQL — БД для n8n и pgvector (vectordb)
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ============================================================
  # PostgreSQL — БД для микросервисов OCR Platform (appdb)
  # ============================================================
  postgres-app:
    image: pgvector/pgvector:pg16
    container_name: postgres_app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    ports:
      - "${APP_DB_BIND_IP:-127.0.0.1}:${APP_DB_PORT:-5433}:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./init_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ============================================================
  # Ollama (GPU, эмбеддинги)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_HOST: "0.0.0.0:11435"
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11435}:11435"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ============================================================
  # n8n (автоматизация, БД = postgres)
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP:-0.0.0.0}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678/}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: "${TZ:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app_net

  # ============================================================
  # MCP Server (инструменты для агента-кодера)
  # ============================================================
  mcp-server:
    build: ./mcp-server
    container_name: project_mcp
    restart: unless-stopped
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-9000}:9000"
    volumes:
      - ./:/workspace
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_WORKSPACE=${MCP_WORKSPACE:-/workspace}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=9000
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_MAX_WORKERS=${MCP_MAX_WORKERS:-10}
      - MCP_MAX_OUTPUT_CHARS=${MCP_MAX_OUTPUT_CHARS:-100000}
      - MCP_COMMAND_TIMEOUT_SECONDS=${MCP_COMMAND_TIMEOUT_SECONDS:-60}
      - MCP_MAX_COMMAND_TIMEOUT_SECONDS=${MCP_MAX_COMMAND_TIMEOUT_SECONDS:-600}
      - MCP_SEARCH_MAX_MATCHES=${MCP_SEARCH_MAX_MATCHES:-200}
      - MCP_EXEC_DEFAULT_WORKDIR=${MCP_EXEC_DEFAULT_WORKDIR:-/app}
      - MCP_SESSION_IDLE_TIMEOUT=${MCP_SESSION_IDLE_TIMEOUT:-300}
      - MCP_MAX_SESSIONS=${MCP_MAX_SESSIONS:-10}
      - MCP_DNS_REBINDING_PROTECTION=${MCP_DNS_REBINDING_PROTECTION:-false}
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - app_net

  # ============================================================
  # OCR Platform: Scheduler Service
  # ============================================================
  ocr-scheduler:
    build:
      context: ./ocr_platform
      dockerfile: Dockerfile
    container_name: ocr_platform_scheduler
    restart: unless-stopped
    command: uvicorn scheduler_service.main:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres-app:5432/${APP_DB_NAME}
      - DB_HOST=postgres-app
      - DB_PORT=5432
      - DB_NAME=${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-change_me_jwt_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-change_me_n8n_api_key}
      - N8N_REQUEST_TIMEOUT_SEC=${N8N_REQUEST_TIMEOUT_SEC:-30}
      - SCHEDULER_HOST=0.0.0.0
      - SCHEDULER_PORT=8001
    ports:
      - "${OCR_SCHEDULER_BIND_IP:-127.0.0.1}:${OCR_SCHEDULER_PORT:-8001}:8001"
    depends_on:
      postgres-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_net

  # ============================================================
  # OCR Platform: OCR Worker
  # ============================================================
  ocr-worker:
    build:
      context: ./ocr_platform
      dockerfile: Dockerfile
    container_name: ocr_platform_worker
    restart: unless-stopped
    command: python -m ocr_worker.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres-app:5432/${APP_DB_NAME}
      - DB_HOST=postgres-app
      - DB_PORT=5432
      - DB_NAME=${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-change_me_jwt_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-change_me_n8n_api_key}
      - N8N_REQUEST_TIMEOUT_SEC=${N8N_REQUEST_TIMEOUT_SEC:-30}
      - OCR_WORKER_POLL_INTERVAL_SEC=${OCR_WORKER_POLL_INTERVAL_SEC:-5}
      - OCR_WORKER_BATCH_SIZE=${OCR_WORKER_BATCH_SIZE:-10}
      - SCHEDULER_SERVICE_URL=http://ocr-scheduler:8001
      - SCHEDULER_REQUEST_TIMEOUT_SEC=${OCR_SCHEDULER_REQUEST_TIMEOUT_SEC:-15}
    depends_on:
      postgres-app:
        condition: service_healthy
      ocr-scheduler:
        condition: service_healthy
    networks:
      - app_net

volumes:
  postgres_data:
  postgres_app_data:
  ollama_data:
  n8n_data:

networks:
  app_net:
    name: app_net
    driver: bridge
