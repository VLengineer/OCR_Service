services:
  postgres_dev:
    image: pgvector/pgvector:pg16
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: 9001
    ports:
      - "9001:9001"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 9001"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app_net_dev:
        aliases:
          - postgres_dev

  ollama_dev:
    image: ollama/ollama:0.40.4
    container_name: ollama_dev
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_HOST: "0.0.0.0:9002"
    ports:
      - "9002:9002"
    volumes:
      - ollama_data_dev:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:9002 ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net_dev

  n8n_dev:
    image: n8nio/n8n:2.46.6
    container_name: n8n_dev
    restart: unless-stopped
    user: "${UID}:${GID}"
    ports:
      - "9000:9000"
    environment:
      N8N_PORT: 9000
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:9000/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n_dev:9000/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - n8n_data_dev:/home/node/.n8n
    depends_on:
      ollama_dev:
        condition: service_healthy
      postgres_dev:
        condition: service_healthy
    networks:
      - app_net_dev

volumes:
  postgres_data_dev:
  ollama_data_dev:
  n8n_data_dev:

networks:
  app_net_dev:
    name: app_net_dev
    external: true